name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  wwebjs-tests:
    name: WhatsApp session recovery tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/wwebjs/package-lock.json
      - name: Install service dependencies without downloading a browser
        working-directory: apps/wwebjs
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci
      - name: Check service syntax and isolated session tests
        run: |
          node --check apps/wwebjs/index.js
          node --test apps/wwebjs/*.test.js

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Postgres y Mongo 7 desechables para las pruebas de la migración (tests/test_pgmirror*.py):
    # la capa se compara contra el motor real de Mongo, no solo contra mongomock.
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27029:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_only
          POSTGRES_DB: commercial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d commercial"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://app:app_ci_only@127.0.0.1:5432/commercial
      TEST_MONGO_URL: mongodb://127.0.0.1:27029
      # Sin esto, si un servicio no levanta, las pruebas contra los motores reales se saltarían en silencio.
      REQUIRE_REAL_ENGINES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Test send request recovery
        run: npm run test:send
      - name: Verify WhatsApp text formatting and safe links
        run: node --test src/lib/whatsappText.test.mjs
