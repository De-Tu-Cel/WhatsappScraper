[pytest]
# Scope discovery to tests/ only. backEnd/ root has ~20 loose diagnostic
# scripts (test_*.py naming, but meant to be run manually against real
# MongoDB/live APIs, not pytest-collected) — a couple of them call sys.exit()
# or send real messages at module import time. Without this, a bare `pytest`
# from backEnd/ recurses into all of them and can crash collection entirely
# (confirmed 2026-09-04: test_wasender.py's sys.exit(1) breaks pytest's own
# output capture mid-collection).
testpaths = tests
