services:

  # ── Frontend (Next.js) ────────────────────────────────────────
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  # ── Backend (FastAPI) ─────────────────────────────────────────
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=commercial
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WWEBJS_URL=http://wwebjs:3001
      - WWEBJS_API_SECRET=${WWEBJS_API_SECRET}
    expose:
      - "8000"
    depends_on:
      - wwebjs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

  # ── wwebjs (WhatsApp personal number — active provider) ───────
  wwebjs:
    build:
      context: ./apps/wwebjs
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - FASTAPI_URL=http://backend:8000
      - API_SECRET=${WWEBJS_API_SECRET}
    volumes:
      - wwebjs_sessions:/app/sessions
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

volumes:
  wwebjs_sessions:
