services:

  # ── Frontend (Next.js) ────────────────────────────────────────
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  # ── Backend (FastAPI) ─────────────────────────────────────────
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=commercial
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WWEBJS_URL=http://wwebjs:3001
      - WWEBJS_API_SECRET=${WWEBJS_API_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      - waha
      - wwebjs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

  # ── wwebjs (WhatsApp personal number — active provider) ───────
  wwebjs:
    build:
      context: ./apps/wwebjs
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - FASTAPI_URL=http://backend:8000
      - API_SECRET=${WWEBJS_API_SECRET}
    volumes:
      - wwebjs_sessions:/app/sessions
    ports:
      - "3002:3001"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

  # ── WAHA (WhatsApp HTTP API — NOWEB engine, legacy) ───────────
  waha:
    image: devlikeapro/waha:noweb
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_PRINT_QR=false
    ports:
      - "3001:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

volumes:
  waha_sessions:
  waha_media:
  wwebjs_sessions:
