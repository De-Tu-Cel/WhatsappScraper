services:

  # ── Frontend (Next.js) ────────────────────────────────────────
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  # ── Backend (FastAPI) ─────────────────────────────────────────
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=commercial
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_ADMIN_API_KEY=${ANTHROPIC_ADMIN_API_KEY:-}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID:-}
      - ANTHROPIC_MONTHLY_BUDGET_USD=${ANTHROPIC_MONTHLY_BUDGET_USD:-10}
      # wwebjs es un recurso aparte en Coolify (docker-compose.wwebjs.yml,
      # docs/WWEBJS_RECURSO_APARTE.md): se le encuentra por su alias en "coolify".
      - WWEBJS_URL=${WWEBJS_URL:-http://detucel-wwebjs:3001}
      - WWEBJS_API_SECRET=${WWEBJS_API_SECRET}
      - WARMUP_ENABLED=${WARMUP_ENABLED}
      - OTP_WEBHOOK_SECRET=${OTP_WEBHOOK_SECRET}
      # Migración a Postgres (docs/MIGRACION_POSTGRES.md). Vacías = solo Mongo, como siempre.
      # DB_MODES lista el modo de cada colección: settings=dual,message_templates=dual,...
      - POSTGRES_URL=${POSTGRES_URL:-}
      - DB_MODES=${DB_MODES:-}
      # Opcionales (vacías = 24 h de espera por modo y conciliación cada 3 h).
      - PGMIRROR_WAIT_HOURS=${PGMIRROR_WAIT_HOURS:-}
      - PGMIRROR_RECONCILE_HOURS=${PGMIRROR_RECONCILE_HOURS:-}
      # Fase de escrituras (vacías = apagadas): 1 = sombra de escrituras; mongo|shadow|postgres = aggregate().
      - PGMIRROR_WRITE_SHADOW=${PGMIRROR_WRITE_SHADOW:-}
      - PGMIRROR_AGGREGATE=${PGMIRROR_AGGREGATE:-}
    expose:
      - "8000"
    restart: unless-stopped
    mem_limit: 1.5g
    # A Docker Compose app gets its own project-scoped network by default,
    # isolated from Coolify's shared "coolify" network where standalone
    # resources like mongodb-detucel actually live — MONGODB_URI's hostname
    # (a Mongo container ID, auto-linked by Coolify) is only resolvable to a
    # container that's ALSO on that network. Confirmed live 2026-09-22: the
    # backend couldn't reach Mongo at all ("Temporary failure in name
    # resolution") until manually joined to it — every prior redeploy today
    # silently lost that connectivity, since nothing in this file declared
    # it. `default` keeps the backend/frontend service-name DNS the frontend
    # relies on (BACKEND_URL=http://backend:8000).
    # Alias fijo en "coolify": así lo encuentra wwebjs, que corre como recurso
    # aparte (docker-compose.wwebjs.yml). "backend" a secas no sirve en esa red:
    # otra aplicación del servidor también tiene un servicio "backend".
    networks:
      default:
      coolify:
        aliases:
          - detucel-backend
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

  # ── Ancla del volumen de sesiones de WhatsApp ────────────────
  # wwebjs corre en su propio recurso (docker-compose.wwebjs.yml) y monta estos mismos
  # archivos por medio de un volumen alias (docs/WWEBJS_RECURSO_APARTE.md). Para Docker eso
  # no cuenta como uso: sin este contenedor el volumen original quedaría "sin usar" y una
  # limpieza de volúmenes lo borraría con todas las sesiones. Solo lectura; no hace nada más.
  wwebjs-sessions-anchor:
    image: busybox:1.36.1
    init: true
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - wwebjs_sessions:/sessions:ro
    restart: unless-stopped
    mem_limit: 16m

volumes:
  # Coolify lo nombra dpwlknbsbuvups4fy4kahcyk_wwebjs-sessions: el volumen de siempre.
  wwebjs_sessions:

networks:
  default:
  coolify:
    external: true
