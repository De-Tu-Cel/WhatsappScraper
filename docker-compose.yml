services:

  # ── Frontend (Next.js) ────────────────────────────────────────
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  # ── Backend (FastAPI) ─────────────────────────────────────────
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=commercial
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_ADMIN_API_KEY=${ANTHROPIC_ADMIN_API_KEY:-}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID:-}
      - ANTHROPIC_MONTHLY_BUDGET_USD=${ANTHROPIC_MONTHLY_BUDGET_USD:-10}
      # Al pasar wwebjs a su propio recurso (docs/WWEBJS_RECURSO_APARTE.md) será
      # http://detucel-wwebjs:3001, su alias en la red "coolify".
      - WWEBJS_URL=${WWEBJS_URL:-http://wwebjs:3001}
      - WWEBJS_API_SECRET=${WWEBJS_API_SECRET}
      - WARMUP_ENABLED=${WARMUP_ENABLED}
      - OTP_WEBHOOK_SECRET=${OTP_WEBHOOK_SECRET}
      # Migración a Postgres (docs/MIGRACION_POSTGRES.md). Vacías = solo Mongo, como siempre.
      # DB_MODES lista el modo de cada colección: settings=dual,message_templates=dual,...
      - POSTGRES_URL=${POSTGRES_URL:-}
      - DB_MODES=${DB_MODES:-}
      # Opcionales (vacías = 24 h de espera por modo y conciliación cada 3 h).
      - PGMIRROR_WAIT_HOURS=${PGMIRROR_WAIT_HOURS:-}
      - PGMIRROR_RECONCILE_HOURS=${PGMIRROR_RECONCILE_HOURS:-}
    expose:
      - "8000"
    depends_on:
      - wwebjs
    restart: unless-stopped
    mem_limit: 1.5g
    # A Docker Compose app gets its own project-scoped network by default,
    # isolated from Coolify's shared "coolify" network where standalone
    # resources like mongodb-detucel actually live — MONGODB_URI's hostname
    # (a Mongo container ID, auto-linked by Coolify) is only resolvable to a
    # container that's ALSO on that network. Confirmed live 2026-09-22: the
    # backend couldn't reach Mongo at all ("Temporary failure in name
    # resolution") until manually joined to it — every prior redeploy today
    # silently lost that connectivity, since nothing in this file declared
    # it. `default` keeps the existing backend/wwebjs/frontend service-name
    # DNS the other two services rely on.
    # Alias fijo en "coolify": así lo encuentra wwebjs cuando corre como recurso
    # aparte (docker-compose.wwebjs.yml), donde "backend" no existe.
    networks:
      default:
      coolify:
        aliases:
          - detucel-backend
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

  # ── wwebjs (WhatsApp personal number — active provider) ───────
  wwebjs:
    # Dar tiempo a Chromium para guardar LocalAuth y recoger sus procesos hijos.
    init: true
    stop_grace_period: 30s
    build:
      context: ./apps/wwebjs
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - FASTAPI_URL=http://backend:8000
      - API_SECRET=${WWEBJS_API_SECRET}
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
      - PROXY_ONLY_SESSIONS=${PROXY_ONLY_SESSIONS}
    volumes:
      - wwebjs_sessions:/app/sessions
    # El mismo alias que tendrá como recurso aparte: antes del corte se comprueba desde el
    # backend que Coolify lo respeta (`getent hosts detucel-wwebjs`).
    networks:
      default:
      coolify:
        aliases:
          - detucel-wwebjs
    restart: unless-stopped
    mem_limit: 6g
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

volumes:
  wwebjs_sessions:

networks:
  default:
  coolify:
    external: true
